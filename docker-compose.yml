# ╔══════════════════════════════════════════════════════════════════════╗
# ║  AI-MultiColony-Ecosystem  —  Full Stack Docker Compose             ║
# ╚══════════════════════════════════════════════════════════════════════╝

version: "3.9"

services:
  # ── API Server ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amce-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-amce}:${POSTGRES_PASSWORD:-amce_dev_password}@postgres:5432/${POSTGRES_DB:-multicolony}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-}
      - MULTICOLONY_API_JWT_SECRET=${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amce-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Background Worker ──────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amce-worker
    restart: unless-stopped
    command: ["python", "-m", "ai_multicolony.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-amce}:${POSTGRES_PASSWORD:-amce_dev_password}@postgres:5432/${POSTGRES_DB:-multicolony}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-}
      - MULTICOLONY_API_JWT_SECRET=${JWT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - amce-network
    deploy:
      resources:
        limits:
          memory: 1g

  # ── PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: amce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multicolony}
      POSTGRES_USER: ${POSTGRES_USER:-amce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amce_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - amce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: amce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - amce-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── QuestDB (Time-series) ───────────────────────────────────────────
  questdb:
    image: questdb/questdb:latest
    container_name: amce-questdb
    restart: unless-stopped
    ports:
      - "9000:9000"   # Web console
      - "8812:8812"   # PostgreSQL wire protocol
      - "9009:9009"   # InfluxDB line protocol
    environment:
      QDB_MALLOC_SIZE: 4G
    volumes:
      - questdb_data:/root/.questdb
    networks:
      - amce-network

volumes:
  postgres_data:
  redis_data:
  questdb_data:

networks:
  amce-network:
    driver: bridge
