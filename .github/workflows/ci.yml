name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linting deps
        run: pip install ruff
      - name: Ruff check
        run: ruff check . --ignore E501 || true
      - name: Check for TODO/FIXME
        run: |
          echo "Checking for TODO/FIXME markers..."
          grep -r "TODO\|FIXME" --include="*.py" . || echo "No TODOs/FIXMEs found"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov
      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-report=xml -x 2>&1 || true
        env:
          PYTHONPATH: .
          TESTING: "1"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install safety
        run: pip install safety pip-audit
      - name: Check for known vulnerabilities
        run: |
          safety check -r requirements.txt || true
          pip-audit -r requirements.txt || true
      - name: Scan for leaked secrets
        run: |
          ! grep -rn "sk-\|AKIA\|ghp_\|xoxb-[0-9]" --include="*.py" --include="*.env" . || echo "WARNING: Potential secret detected"
